project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    - name: C00
      id: 0
      slot_id: 0
      region:
        # Clock-region column X4 carries the U280's I/O banks, and fpga_u280.xdc
        # pins static cells into X4Y11: hbm_cattrip (IOB_X0Y606), msp_uart_txd
        # (IOB_X0Y609), qsfp0_refclk_fs (IOB_X0Y590) and qsfp0_refclk_oe_b
        # (IOB_X0Y589). A reconfigurable partition may not contain static logic,
        # so place_design refused the whole design with DRC HDPR-6 rather than
        # place anything. Carve that one clock region out; the other 23 stay.
        add: CLOCKREGION_X2Y11:CLOCKREGION_X7Y8
        remove: CLOCKREGION_X4Y11:CLOCKREGION_X4Y11
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
      - name: top_k
        id: 2
        unit: top_k
      - name: log
        id: 3
        unit: log
      - name: norm
        id: 4
        unit: norm
    - name: C01
      id: 1
      slot_id: 1
      region:
        add: CLOCKREGION_X3Y7:CLOCKREGION_X7Y6
      components:
      - name: or_slot
        id: 5
        unit: or_slot
      - name: pattern_slot
        id: 6
        unit: pattern_slot
      - name: top_k
        id: 7
        unit: top_k
      - name: log
        id: 8
        unit: log
      - name: norm
        id: 9
        unit: norm
    - name: C02
      id: 2
      slot_id: 2
      region:
        # Same as C00: X4Y5 holds the 100 MHz reference clock's input buffer,
        # clk_100mhz_0_ibufg_inst (IOB_X0Y286 and HPIOBDIFFINBUF_X0Y132).
        #
        # C01 needs no carve-out. Its X4Y6/X4Y7 are the same I/O column, but
        # nothing in fpga_u280.xdc is pinned there, so no static cell lands
        # inside it. That is a property of the current pin list rather than of
        # the floorplan -- a new pin in those two regions would break C01 the
        # same way, and the fix would be the same one line.
        add: CLOCKREGION_X3Y5:CLOCKREGION_X7Y5
        remove: CLOCKREGION_X4Y5:CLOCKREGION_X4Y5
      components:
      - name: or_slot
        id: 10
        unit: or_slot
      - name: pattern_slot
        id: 11
        unit: pattern_slot
      - name: top_k
        id: 12
        unit: top_k
      - name: log
        id: 13
        unit: log
      - name: norm
        id: 14
        unit: norm
