project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # Four cells down the right of the device, two in SLR2, one the full height
    # of SLR1 and one in SLR0, each with static on its left. The static pblock
    # in frac/xdc/floorplan.xdc is carved around exactly these regions -- keep
    # the two files consistent. Every cell talks to static with credits, not
    # ready (kernels/user_krnl/reassembly/rtl/slot_credit.v), so the boundary
    # pipelines can reach any SLR.
    # All four carry the same set, so any slot can be swapped to any of them
    # and the four can run different ones at once: top_k, norm and log, then
    # or_slot and pattern_slot, whose responses are as long as their requests
    # (all-ones and echo) for throughput tests and probing.  The first in each
    # list is what the full image starts with.
    - name: C00
      id: 0
      slot_id: 0
      region:
        # Six clock regions, the top two rows of SLR2 in X5-X7: static
        # X4Y10:X4Y11 to the left; C01 below.
        add: CLOCKREGION_X5Y10:CLOCKREGION_X7Y11
      components:
      - name: top_k
        id: 0
        unit: top_k
      - name: norm
        id: 1
        unit: norm
      - name: log
        id: 2
        unit: log
      - name: or_slot
        id: 6
        unit: or_slot
      - name: pattern_slot
        id: 7
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        # Six clock regions, the bottom two rows of SLR2 in X5-X7: static
        # X4Y8:X4Y9 to the left and X5Y7 below; C00 above, C02 below X6-X7.
        add: CLOCKREGION_X5Y8:CLOCKREGION_X7Y9
      components:
      - name: top_k
        id: 3
        unit: top_k
      - name: norm
        id: 4
        unit: norm
      - name: log
        id: 5
        unit: log
      - name: or_slot
        id: 8
        unit: or_slot
      - name: pattern_slot
        id: 9
        unit: pattern_slot
    - name: C02
      id: 2
      slot_id: 2
      region:
        # Eight clock regions, all four rows of SLR1 in X6-X7: static
        # X5Y4:X5Y7 to the left; C01 above and C03 below.
        add: CLOCKREGION_X6Y4:CLOCKREGION_X7Y7
      components:
      - name: top_k
        id: 10
        unit: top_k
      - name: norm
        id: 11
        unit: norm
      - name: log
        id: 12
        unit: log
      - name: or_slot
        id: 13
        unit: or_slot
      - name: pattern_slot
        id: 14
        unit: pattern_slot
    - name: C03
      id: 3
      slot_id: 3
      region:
        # Six clock regions, the top two rows of SLR0 in X5-X7: static
        # X4Y2:X4Y3 to the left, X5Y1:X7Y1 below and X5Y4 above; C02 above
        # X6-X7.
        add: CLOCKREGION_X5Y2:CLOCKREGION_X7Y3
      components:
      - name: top_k
        id: 15
        unit: top_k
      - name: norm
        id: 16
        unit: norm
      - name: log
        id: 17
        unit: log
      - name: or_slot
        id: 18
        unit: or_slot
      - name: pattern_slot
        id: 19
        unit: pattern_slot
