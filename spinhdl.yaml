project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # Three cells, all in the right-hand columns and none in SLR2. Every cell
    # starts at X5, so none touches the X4 I/O column and none needs a
    # carve-out. The static pblock in frac/xdc/floorplan.xdc takes what is
    # left -- keep the two files consistent.
    - name: C00
      id: 0
      slot_id: 0
      region:
        # Shrunk from X3Y7:X7Y6: the left edge moves X3 -> X5 so the cell no
        # longer reaches into the middle of SLR1.
        add: CLOCKREGION_X5Y6:CLOCKREGION_X7Y7
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        add: CLOCKREGION_X5Y4:CLOCKREGION_X7Y5
      components:
      - name: or_slot
        id: 2
        unit: or_slot
      - name: pattern_slot
        id: 3
        unit: pattern_slot
    - name: C02
      id: 2
      slot_id: 2
      region:
        # The geometry proven on hardware by the reconf_hdr_frmt build, and the
        # only cell here that sits in SLR0 alongside the ICAPE3.
        add: CLOCKREGION_X5Y3:CLOCKREGION_X6Y3
      components:
      - name: or_slot
        id: 4
        unit: or_slot
      - name: pattern_slot
        id: 5
        unit: pattern_slot
