project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # Three cells, taken from the opt_hbm_icap_fifo floorplan, with C02
    # relocated to X5Y4:X7Y5. The static pblock in frac/xdc/floorplan.xdc
    # takes everything these three leave free -- keep the two files
    # consistent.
    - name: C00
      id: 0
      slot_id: 0
      region:
        # X4Y11 holds pinned static I/O (IOB_X0Y589/590/606/609). A
        # reconfigurable partition may not contain static logic, so without
        # this carve-out place_design refuses the design with DRC HDPR-6.
        add: CLOCKREGION_X2Y11:CLOCKREGION_X7Y8
        remove: CLOCKREGION_X4Y11:CLOCKREGION_X4Y11
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        # Needs no carve-out: nothing is pinned in X4Y6/X4Y7 with the current
        # pin list. A new pin there would break this cell with DRC HDPR-6.
        add: CLOCKREGION_X3Y7:CLOCKREGION_X7Y6
      components:
      - name: or_slot
        id: 2
        unit: or_slot
      - name: pattern_slot
        id: 3
        unit: pattern_slot
    - name: C02
      id: 2
      slot_id: 2
      region:
        # Relocated from the original X3Y5:X7Y5. Starting at X5 keeps the cell
        # clear of the X4 I/O column entirely, so unlike the original it needs
        # no X4Y5 carve-out for the 100 MHz refclk input buffer.
        add: CLOCKREGION_X5Y4:CLOCKREGION_X7Y5
      components:
      - name: or_slot
        id: 4
        unit: or_slot
      - name: pattern_slot
        id: 5
        unit: pattern_slot
