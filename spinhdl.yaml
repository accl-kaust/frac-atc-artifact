project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # The floorplan proven on hardware by the reconf_hdr_frmt build: two small
    # cells in SLR0, right of the X4 I/O column, two clock regions each.
    # Neither cell touches X4, so no carve-out is needed. The static pblock in
    # frac/xdc/floorplan.xdc owns the left half of SLR0 (X0-X3) and all of
    # SLR1 -- keep it clear of these regions.
    - name: C00
      id: 0
      slot_id: 0
      region:
        add: CLOCKREGION_X5Y3:CLOCKREGION_X6Y3
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        # Moved out of SLR0 into SLR2, the far die. Same two-clock-region
        # shape and same X5-X6 columns as the cell that reconfigures today,
        # and X5Y8 holds the same 960 LAGUNA sites that the working X5Y3
        # does, so the SLR is the only variable. C00 stays in SLR0 as an
        # in-image control. Static never claimed SLR2, so it needs no
        # carve-out; the cmac pblock is the only other thing up there.
        add: CLOCKREGION_X5Y8:CLOCKREGION_X6Y8
      components:
      - name: or_slot
        id: 2
        unit: or_slot
      - name: pattern_slot
        id: 3
        unit: pattern_slot
