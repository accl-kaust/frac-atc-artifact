project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # Two cells, both in SLR1. The former C00 spanned 23 clock regions across
    # SLR2 (X2Y11:X7Y8); every partition pin of its 512-bit boundary crossed
    # at least one SLR from the static logic, and that region is dropped
    # entirely until reconfiguration is proven on the small floorplan.
    - name: C00
      id: 0
      slot_id: 0
      region:
        # Clock-region column X4 carries the U280's I/O banks. Nothing in
        # fpga_u280.xdc is pinned in X4Y6/X4Y7 today, so no carve-out is
        # needed here -- a property of the current pin list rather than of
        # the floorplan. A new pin in those two regions would break this cell
        # with DRC HDPR-6, and the fix would be a one-line remove like C01's.
        add: CLOCKREGION_X3Y7:CLOCKREGION_X7Y6
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        # X4Y5 holds the 100 MHz reference clock's input buffer,
        # clk_100mhz_0_ibufg_inst (IOB_X0Y286 and HPIOBDIFFINBUF_X0Y132).
        # A reconfigurable partition may not contain static logic, so
        # place_design refuses the whole design with DRC HDPR-6 unless that
        # one clock region is carved out; the other four stay.
        add: CLOCKREGION_X3Y5:CLOCKREGION_X7Y5
        remove: CLOCKREGION_X4Y5:CLOCKREGION_X4Y5
      components:
      - name: or_slot
        id: 2
        unit: or_slot
      - name: pattern_slot
        id: 3
        unit: pattern_slot
