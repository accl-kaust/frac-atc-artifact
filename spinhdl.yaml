project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # The floorplan proven on hardware by the reconf_hdr_frmt build: two small
    # cells in SLR0, right of the X4 I/O column, two clock regions each.
    # Neither cell touches X4, so no carve-out is needed. The static pblock in
    # frac/xdc/floorplan.xdc owns the left half of SLR0 (X0-X3) and all of
    # SLR1 -- keep it clear of these regions.
    - name: C00
      id: 0
      slot_id: 0
      region:
        add: CLOCKREGION_X5Y3:CLOCKREGION_X6Y3
      components:
      - name: or_slot
        id: 0
        unit: or_slot
      - name: pattern_slot
        id: 1
        unit: pattern_slot
    - name: C01
      id: 1
      slot_id: 1
      region:
        add: CLOCKREGION_X5Y2:CLOCKREGION_X6Y2
      components:
      - name: or_slot
        id: 2
        unit: or_slot
      - name: pattern_slot
        id: 3
        unit: pattern_slot
    - name: C02
      id: 2
      slot_id: 2
      region:
        # Stacked directly below C01, same shape as the two proven cells: two
        # clock regions, SLR0, columns X5-X6, clear of the X4 I/O column. Cell
        # SIZE is the one variable the campaign has never moved -- every cell
        # ever demonstrated to reconfigure has been exactly two clock regions --
        # so this third cell keeps it rather than testing two things at once.
        # Y1 rather than Y0 on purpose: the HBM interface sites sit along the
        # bottom row. frac/xdc/floorplan.xdc splits its Y1 strip around this.
        add: CLOCKREGION_X5Y1:CLOCKREGION_X6Y1
      components:
      - name: or_slot
        id: 4
        unit: or_slot
      - name: pattern_slot
        id: 5
        unit: pattern_slot
