# Latency of top_k, logit and norm, one function at a time: the isolated half
# of Fig. 14.
#
#   eval/run.py mixed_workload      measure, on the machine cabled to the U280
#   eval/plot.py mixed_workload     draw the figure from the newest run
#
# run.py programs the full image once, then for each function loads its
# partial bitstream into slot 0 and runs one client against it.

description: Latency of top_k, logit and norm, one at a time (Fig. 14, isolated half)

# One programming for the whole experiment; only slot 0 changes between runs.
program: once

targets:
  1:                                    # with fRAC; there is no bypass run here
    bitstream: build/frac/bitstreams/jtag/frac.bit
    partials: build/frac/bitstreams/icap

# f is the paper's function id, which the figure script finds in the log
# names.  Before the runs of each f, run.py loads `partial`, a file in the
# target's partials, into `slot`.  R is the response size fperf waits for:
# top_k always answers one 64-byte line, while logit and norm answer one line
# per data line, so the request less its 64-byte header.
functions:
  1: {slot: 0, partial: c00_f00.bin, R: 64}     # top_k
  3: {slot: 0, partial: c00_f02.bin, R: 960}    # log, the logit
  5: {slot: 0, partial: c00_f01.bin, R: 960}    # norm

params:
  O: 1
  d: 40                         # seconds per run; the figure drops the first 10
  m: 1024                       # message bytes, fperf -m
  X: 1024                       # request bytes including the header, fperf -X
  n: 1                          # one client thread, fperf -n
  C: 1                          # connections per client thread, fperf -C

sweep:
  f: [1, 3, 5]                  # top_k, logit, norm, in the figure's order

# Log names, as in the paper; the figure script picks logs by f_<id>.
name: "rr_d_{d}_m_{m}_n_{n}_C_{C}_f_{f}_X_{X}_O_{O}.log"

# fperf arguments.  run.py adds -c, -p and -S from the testbed file.
fperf: "-t rr -d {d} -n {n} -m {m} -X {X} -R {R} -C {C} -Z 1 -K {slot}"

plot:
  # The paper's script, copied unchanged from
  # github.com/accl-kaust/frac_evaluation_script at commit 164b196.  It reads
  # the isolated runs from data/mixed_workload/isolated, and draws nothing
  # unless data/mixed_workload/mixed exists too.  The mixed half, with the
  # functions running at once, is not measured yet, so that directory is
  # empty and the figure shows the isolated bars only.
  - script: mixed_workload_fig_14.py
    data:
      data/mixed_workload/isolated: run
      data/mixed_workload/mixed: empty
