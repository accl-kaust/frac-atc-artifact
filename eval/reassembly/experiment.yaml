# Reassembly: latency of top_k, logit and norm when a request is written in
# one, two or four pieces of 1024 bytes (Fig. 15).
#
#   eval/run.py reassembly      measure, on the machine cabled to the U280
#   eval/plot.py reassembly     draw the figure from the newest run
#
# run.py programs the full image once.  For each function it loads the
# partial into slot 0 once, then runs one client with requests of 1024, 2048
# and 4096 bytes, each written 1024 bytes at a time.

description: Latency with requests written in 1, 2 and 4 pieces of 1024 bytes (Fig. 15)

program: once

targets:
  1:                                    # with fRAC; there is no bypass run here
    bitstream: example/frac/jtag/frac.bit
    partials: example/frac/icap

# f is the paper's function id, which the figure script reads from the log
# names.  R is the response size fperf waits for: top_k always answers one
# 64-byte line, while logit and norm answer one line per data line, so the
# request less its 64-byte header.  "{X} - 64" is worked out for each X.
functions:
  1: {slot: 0, partial: c00_f00.bin, R: 64}             # top_k
  3: {slot: 0, partial: c00_f02.bin, R: "{X} - 64"}     # log, the logit
  5: {slot: 0, partial: c00_f01.bin, R: "{X} - 64"}     # norm

params:
  O: 1
  d: 40                         # seconds per run; the figure drops the first 10
  m: 1024                       # bytes per write, fperf -m: X/m writes a request
  n: 1                          # one client thread, fperf -n
  C: 1                          # connections per client thread, fperf -C

sweep:                          # the first key is the outer loop
  f: [1, 3, 5]                  # top_k, logit, norm: one slot load each
  X: [1024, 2048, 4096]         # request bytes including the header, fperf -X

# Log names, as in the paper; the figure script reads f_<id> and X_<bytes>.
name: "rr_d_{d}_m_{m}_n_{n}_C_{C}_f_{f}_X_{X}_O_{O}.log"

# fperf arguments.  run.py adds -c, -p and -S from the testbed file.
fperf: "-t rr -d {d} -n {n} -m {m} -X {X} -R {R} -C {C} -Z 1 -K {slot}"

plot:
  # The paper's script, copied unchanged from
  # github.com/accl-kaust/frac_evaluation_script at commit 164b196.  It reads
  # data/reassembly and counts X/1024 fragments per request.
  - script: reassembly_fig_15.py
    data: data/reassembly
