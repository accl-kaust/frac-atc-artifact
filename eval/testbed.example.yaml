# Settings for the machine eval/run.py runs on: the one cabled to the U280.
# Copy this file to eval/testbed.yaml and edit it there; testbed.yaml is
# gitignored.  Every key is optional, and the values below are the defaults.

fpga:
  addr: 172.24.1.52             # the design's address and port, see docs/quick-start.rst
  port: 2888

nic: ""                         # ConnectX port cabled to the U280, passed as TPA_ETH_DEV;
                                # empty: the interface with a direct route to fpga.addr
jtag: ""                        # JTAG target for programfpga.sh, passed as HW_TARGET, such as
                                # localhost:3121/xilinx_tcf/Xilinx/<serial>; empty: the first
start_cpu: 0                    # first cpu fperf pins client threads to, fperf -S

tpa: ""                         # tpa launcher; empty: tpa in PATH, else ~/.local/bin/tpa
fperf: ""                       # fperf binary; empty: ~/libtpa/build/bin/app/fperf,
                                # else ~/.local/bin/fperf, else fperf in PATH
tpa_id: client
tpa_cfg: "tcp {tso = 0; } dpdk { socket-mem = 8192; mbuf_mem_size = 6GB; }"
                                # an experiment's own tpa_cfg is added after this
sudo: sudo                      # fperf needs root for DPDK; "" when run.py runs as root

# Relative to the repository root, or absolute.
programfpga: scripts/programfpga.sh
reconfslots: go run scripts/reconfslots.go      # or a binary built from it
reconf:
  chunk_size: 256               # reconfslots -chunk-size
  hbm_addr: "0x10004000"        # reconfslots -hbm-addr

settle: 10                      # seconds to wait after programming, before probing
ready_timeout: 90               # seconds to wait for the link and for ping
pause: 3                        # seconds between runs

# The CPU server of scalability_cpu, fperf's own server, which run.py starts
# afresh for every sweep point and stops after it.  Only experiments with a
# server use this; their clients run here and talk to it instead of the FPGA.
# The server machine needs its own 8 GB of hugepages and about 20 GB of free
# memory besides, which fperf's server fills with request buffers it never frees.
server:
  host: ""                      # ssh destination of the server machine, such as user@host.
                                # ssh must log in without a password or prompt, and sudo -n
                                # must work there.  Empty: this machine, on a port of its own
  addr: ""                      # the server port's IPv4 address, which the clients connect to
  port: 4096                    # fperf -p
  nic: ""                       # that port's interface on the server machine, TPA_ETH_DEV; give
                                # it the same MTU as nic above, 9000 in the paper
  start_cpu: 0                  # first cpu of the server threads, fperf -S; keep them on the
                                # NIC's NUMA node, and off the clients' cpus on this machine
  tpa: ""                       # paths to tpa and fperf on the server machine; empty: tpa and
  fperf: ""                     # fperf above, else ~/.local/bin/tpa, ~/libtpa/build/bin/app/fperf
  tpa_id: server                # on this machine, it must differ from tpa_id above
  tpa_cfg: ""                   # empty: tpa_cfg above
  sudo: sudo                    # sudo on the server machine, run with -n; "" when ssh logs in
                                # as root.  A server on this machine uses sudo above
  ready_timeout: 60             # seconds to wait for a server over ssh to take connections
  settle: 10                    # seconds to give a server on this machine before the clients
