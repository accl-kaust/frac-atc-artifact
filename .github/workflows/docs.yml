name: Publish documentation

on:
  push:
    branches: [reconf-hdr-frmt-port]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: [self-hosted, linux, x64]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m venv "$RUNNER_TEMP/docs-venv"
          source "$RUNNER_TEMP/docs-venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install sphinx sphinx-rtd-theme

          if [[ -f docs/requirements.txt ]]; then
            python -m pip install -r docs/requirements.txt
          fi

          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: |
          if [[ -f docs/conf.py ]]; then
            source_dir=docs
          elif [[ -f docs/source/conf.py ]]; then
            source_dir=docs/source
          else
            echo "::error::Cannot find docs/conf.py or docs/source/conf.py"
            exit 1
          fi

          python -m sphinx -b html "$source_dir" _build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

