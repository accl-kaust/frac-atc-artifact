project:
  name: frac
  version: 0.1.0
  part: xcu280-fsvh2892-2L-e
  arch: ultraplus
  depth: 1
  contain_static_routing: false

root:
  name: frac_top
  id: 0
  components:
  - name: frac_static
    id: 0
    cells:
    # Both cells are in SLR1, each with static on two sides. The static pblock
    # in frac/xdc/floorplan.xdc is carved around exactly these regions -- keep
    # the two files consistent. SLR0 now holds no cell.
    # Both cells carry the same three accelerators, so either slot can be
    # swapped to any of them and the pair can run different ones at once.
    - name: C00
      id: 0
      slot_id: 0
      region:
        # Four clock regions, the top-right corner of SLR1: static X5Y6:X5Y7
        # to the left and X6Y5:X7Y5 below.
        add: CLOCKREGION_X6Y6:CLOCKREGION_X7Y7
      components:
      - name: top_k
        id: 0
        unit: top_k
      - name: norm
        id: 1
        unit: norm
      - name: log
        id: 2
        unit: log
    - name: C01
      id: 1
      slot_id: 1
      region:
        # Three clock regions along the bottom row of SLR1: static X4Y4 to the
        # left and X5Y5:X7Y5 above.
        add: CLOCKREGION_X5Y4:CLOCKREGION_X7Y4
      components:
      - name: top_k
        id: 3
        unit: top_k
      - name: norm
        id: 4
        unit: norm
      - name: log
        id: 5
        unit: log
