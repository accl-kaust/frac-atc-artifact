units:
- name: pattern_slot
  path: kernels/user_krnl/apps/pattern_slot
  moduletype: recon
  top: pattern_slot
  build: synth
  build_dir: build
  rtl:
    dir: src/rtl
    files:
    - pattern_slot.v
    - pattern_slot_core.v
    # the boundary's credit ends; the static side uses the same file
    - ../../../../reassembly/rtl/slot_credit.v
  xdc:
    dir: src/xdc
    files: null
  xci:
    dir: src/xci
    files: null
  ip:
    dir: src/ip
    files: null
  # out-of-context synthesis, Vivado 2022.2: 673 LUT, 1690 FF, 0 BRAM, 0 DSP
  utilization:
    slices: 106
    ramb36: 0
    dsp: 0
