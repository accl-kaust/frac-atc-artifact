  xdc:
    dir: src/xdc
    files: null
  xci:
    dir: src/xci
    files: null
  ip:
    dir: src/ip
    files: null
  # out-of-context synthesis, Vivado 2022.2: 64 LUT, 132 FF, 0 BRAM, 0 DSP
  utilization:
    slices: 9
    ramb36: 0
    dsp: 0
